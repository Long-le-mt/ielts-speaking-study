<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>IELTS Speaking · Study library</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#lesson">Skip to lesson</a>
    <header class="masthead">
      <div class="brand">
        <div>
          <h1>IELTS Speaking</h1>
          <p>Study library</p>
        </div>
      </div>
      <button id="toggle-sidebar" class="secondary sidebar-toggle" type="button" aria-controls="library-browser" aria-expanded="true">Hide filters</button>
    </header>
    <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="Close filters" tabindex="-1" hidden></button>

    <div class="workspace">
      <aside class="library" id="library-browser" aria-labelledby="library-title">
        <div class="sidebar-heading">
          <h2 id="library-title">Lessons &amp; filters</h2>
          <button id="close-sidebar" class="secondary" type="button" aria-label="Hide filters">Close</button>
        </div>
        <div class="library-content">
        <label class="visually-hidden" for="search">Search by topic, part or source</label>
        <input type="search" id="search" placeholder="Search topic, part or source…" autocomplete="off" disabled>
        <div class="filters">
          <label class="visually-hidden" for="part">Filter by speaking part</label>
          <select id="part" disabled><option value="">All parts</option></select>
          <label class="visually-hidden" for="publisher">Filter by source</label>
          <select id="publisher" disabled><option value="">All sources</option></select>
          <label class="visually-hidden" for="availability">Filter by availability</label>
          <select id="availability" disabled>
            <option value="">All materials</option>
            <option value="synced">Sentence sync (5 lessons)</option>
            <option value="audio">Audio available</option>
            <option value="video">YouTube video linked</option>
            <option value="transcript">Transcript available</option>
            <option value="missing">Missing transcript</option>
          </select>
          <label class="visually-hidden" for="year">Filter by year</label>
          <select id="year" disabled><option value="">All years</option></select>
        </div>
        <div class="result-summary">
          <p id="topic-count" class="topic-count" role="status">Loading topics…</p>
          <button id="clear-filters" class="clear-filters" type="button" hidden>Clear filters</button>
        </div>
        <ul id="topic-list" class="topic-list" aria-label="Study topics"></ul>
        </div>
      </aside>

      <main id="lesson" class="lesson" tabindex="-1">
        <p class="notice" role="status">Loading your study library…</p>
      </main>
    </div>
    <noscript>Enable JavaScript to browse the study library.</noscript>
  </body>
</html>
