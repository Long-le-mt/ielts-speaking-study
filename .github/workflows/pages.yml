name: Deploy IELTS study site

on:
  push:
    branches: [master]
    paths:
      - src/**
      - public/**
      - data/db.json
      - index.html
      - vite.config.mts
      - 'tsconfig*.json'
      - package.json
      - package-lock.json
      - scripts/pages-recovery.js
      - .github/workflows/pages.yml
  workflow_dispatch:
  workflow_run:
    workflows: [Update IELTS TIME catalog]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ielts-study-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      ${{ github.ref == 'refs/heads/master' &&
          (github.event_name != 'workflow_run' ||
           (github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Record deployed source revision
        run: printf 'PAGES_SOURCE_SHA=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - name: Verify static artifact
        run: |
          test -s dist/index.html
          test -s dist/db.json
          test -s dist/alignment.json
          test -s dist/dialogue.json
          test -s dist/version.json
          test -f dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
